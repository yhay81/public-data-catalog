name: Publish MCP registry metadata

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mcp-registry
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify tag and server versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(jq -r .version server.json)"
      - name: Record metadata digest
        run: sha256sum server.json > server.json.sha256
      - name: Attest exact registry metadata
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: server.json
      - name: Preserve attested release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-metadata-${{ github.ref_name }}
          path: |
            server.json
            server.json.sha256
          retention-days: 90
      - name: Install the pinned MCP publisher
        env:
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish remote server metadata
        run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-metadata-${{ github.ref_name }}
          path: release/
      - name: Create immutable GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
