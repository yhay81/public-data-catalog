name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install MCP dependencies
        run: npm ci
      - name: Validate catalog and recipes
        run: python3 scripts/validate_catalog.py
      - name: Verify generated artifacts
        run: npm run artifacts:check
      - name: Validate agent evaluation set
        run: python3 scripts/evaluate_agent_traces.py --check-set
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Type-check MCP and Worker
        run: npm run typecheck
      - name: Test MCP tools
        run: npm test
