name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install MCP dependencies
        run: npm ci
      - name: Validate catalog and recipes
        run: python3 scripts/validate_catalog.py
      - name: Verify generated artifacts
        run: npm run artifacts:check
      - name: Validate agent evaluation set
        run: python3 scripts/evaluate_agent_traces.py --check-set
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Type-check MCP and Worker
        run: npm run typecheck
      - name: Test MCP tools
        run: npm test
