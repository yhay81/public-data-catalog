name: Recipe probes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate local contracts
        run: python3 scripts/validate_catalog.py
      - name: Probe reviewed retrieval recipes
        run: python3 scripts/recipe_tool.py check
