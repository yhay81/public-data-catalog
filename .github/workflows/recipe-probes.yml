name: Recipe probes

on:
  workflow_dispatch:
  schedule:
    - cron: "38 19 * * 5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate local contracts
        run: python3 scripts/validate_catalog.py
      - name: Probe reviewed retrieval recipes
        run: python3 scripts/recipe_tool.py check
